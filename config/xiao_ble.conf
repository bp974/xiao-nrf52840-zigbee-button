# Extra configuration for XIAO nRF52840 bring-up.
# Keep this small so the Nordic sample's own prj.conf remains authoritative.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# XIAO's Zephyr board exposes USB CDC ACM. These make the intent explicit
# for bring-up/debugging.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
